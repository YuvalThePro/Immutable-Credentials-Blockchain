# =============================================================================
# Validator Configuration  –  Accredited Universities (Proof-of-Authority)
# =============================================================================
#
# In this network, every validator IS a university and every participating
# university IS a validator. There are no independent consensus nodes.
#
# Each university:
#   1. Runs a full validator node with its own key pair
#   2. May submit credentials issued by its own institution
#   3. Participates in PoA voting: a block is only finalised after a majority
#      of listed universities have approved it
#   4. Signs every block it proposes with its private key (stored securely
#      on the university's server — never in this file)
#
# Read-only nodes (student portals, employer verifiers, public explorers)
# are NOT listed here. They can verify credentials but cannot issue them.
#
# Key format: Base64-encoded X.509 (SubjectPublicKeyInfo) public key.
#   Generate with: keytool or CryptoUtils.generateKeyPair()
# =============================================================================

# Validator 1 - University A
validator.1.id=VALIDATOR_UNIVERSITY_A
validator.1.name=University A Validator
validator.1.institution=University A
validator.1.publickey=<PUBLIC_KEY_A_PLACEHOLDER>

# Validator 2 - University B
validator.2.id=VALIDATOR_UNIVERSITY_B
validator.2.name=University B Validator
validator.2.institution=University B
validator.2.publickey=<PUBLIC_KEY_B_PLACEHOLDER>

